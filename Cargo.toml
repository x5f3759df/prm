[package]
name = "prm"
version = "0.3.0"
edition = "2024"
description = "Proton Runner Manager for Steam"
license = "GPL-3.0-or-later"

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
flate2 = "1.1"
xz2 = { version = "0.1", features = ["static"] }
zstd = { version = "0.13", default-features = false }
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
