[package]
name = "prm"
version = "0.2.0"
edition = "2024"
description = "Proton Runner Manager for Steam"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
flate2 = "1.1"
xz2 = "0.1"
zstd = "0.13"
sha2 = "0.10"
